name: Build macOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Swift Code
      run: |
        SWIFT_FILE=$(find . -maxdepth 2 -name "*.swift" | head -n 1)
        echo "Compiling file: $SWIFT_FILE"
        swiftc "$SWIFT_FILE" -o WinterCodeForMacFirstExecutable

    - name: Create macOS App Bundle
      run: |
        mkdir -p WinterCodeForMacFirst.app/Contents/MacOS
        mkdir -p WinterCodeForMacFirst.app/Contents/Resources
        mv WinterCodeForMacFirstExecutable WinterCodeForMacFirst.app/Contents/MacOS/WinterCodeForMacFirst
        
        cat << 'EOF' > WinterCodeForMacFirst.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>WinterCodeForMacFirst</string>
            <key>CFBundleIdentifier</key>
            <string>com.timcreator.wintercodeformacfirst</string>
            <key>CFBundleName</key>
            <string>WinterCodeForMacFirst</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
        </dict>
        </plist>
        EOF

        zip -r WinterCodeForMacFirst-macOS.zip WinterCodeForMacFirst.app

    - name: Upload App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinterCodeForMacFirst-macOS-App
        path: WinterCodeForMacFirst-macOS.zip
