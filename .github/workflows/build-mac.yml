name: Build macOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Build with Swift
      run: swift build -c release

    - name: Package App
      run: |
        mkdir -p WinterCode.app/Contents/MacOS
        cp .build/release/WinterCode-for-Mac WinterCode.app/Contents/MacOS/WinterCode
        zip -r WinterCode-macOS.zip WinterCode.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinterCode-Bundle
        path: WinterCode-macOS.zip
